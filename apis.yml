aid: paxton-ai
name: Paxton AI
description: >-
  Paxton AI is a legal AI assistant built for attorneys and law firms,
  delivering rapid case-law and regulatory research, AI-assisted document
  drafting, file analysis, deposition and discovery summarization, and
  specialized workflows for medical chronologies and billing summaries.
  Founded by Tanguy Chau (CEO) and Michael Ulin and headquartered in
  Bend, Oregon, the company has raised roughly $28M across a $6M seed
  round led by WVV Capital and a $22M Series A led by Unusual Ventures,
  with participation from Kyber Knight and 25Madison. Paxton's platform
  covers US federal regulations, state laws, and case law across all
  fifty states, surfaces precise authority-linked citations, and runs in
  a closed model environment that is SOC 2, ISO 27001, and HIPAA
  compliant with data never used for model training. The product is
  delivered as a web SaaS targeted at solo practitioners, small and
  mid-size firms, and enterprise legal teams across personal injury,
  family, employment, criminal, and corporate practice areas; commercial
  access is sold via per-seat Individual plans ($499/month or
  $2,999/year) and a volume-priced Enterprise plan, with a 7-day free
  trial. Paxton publishes a small public GitHub presence with citator
  and legal-hallucination benchmark datasets but does not offer a public
  developer API, SDK, or open-source platform.
